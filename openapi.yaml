openapi: 3.1.0
info:
  title: Harborline Status API
  version: 1.0.0
  description: Publish incidents and power customer-facing status experiences.
servers:
  - url: https://api.harborline.example
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness
      responses:
        "200":
          description: Healthy
  /version:
    get:
      operationId: getVersion
      summary: Read the running release version
      responses:
        "200":
          description: Version metadata
  /v1/components:
    get:
      operationId: listComponents
      summary: List public service components
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Component collection
  /v1/incidents:
    get:
      operationId: listIncidents
      summary: List incidents newest first
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Incident collection
    post:
      operationId: createIncident
      summary: Open an incident
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIncidentInput"
      responses:
        "201":
          description: Incident opened
  /v1/incidents/{incidentId}:
    parameters:
      - name: incidentId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getIncident
      summary: Fetch one incident
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Incident
        "404":
          description: Incident not found
    patch:
      operationId: updateIncident
      summary: Update incident status or message
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Updated incident
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    CreateIncidentInput:
      type: object
      required: [title, message, componentIds]
      properties:
        title:
          type: string
          maxLength: 120
        message:
          type: string
          maxLength: 2000
        componentIds:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: string
